name: Fetch Football Data

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 Türkiye saati → BUGÜN
    - cron: "0 9 * * *"   # 12:00 Türkiye saati → YARIN
  workflow_dispatch:
    inputs:
      target_day:
        description: "Hangi gün çekilsin?"
        type: choice
        options: [today, tomorrow]
        default: today

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Fetch data and write to Firestore
        working-directory: scripts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_DAY: ${{ github.event.inputs.target_day || (github.event.schedule == '0 9 * * *' && 'tomorrow' || 'today') }}
        run: node fetch-football-data.js
