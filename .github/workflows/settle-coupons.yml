name: AI kuponlarını sonuçlandır

on:
  schedule:
    # GitHub zamanlayıcısı gecikebilir/atlayabilir: gece 00:30 ve 02:30, sabah ve gün içinde tekrar denenir
    # (açık kupon yoksa saniyeler içinde biter, API-Football'a istek atmaz).
    - cron: "30 21,23,3,6,9,12 * * *"   # 00:30, 02:30, 06:30, 09:30, 12:30, 15:30 Türkiye saati
  workflow_dispatch:
    inputs:
      tekrar:
        description: "Daha önce 'Sonuç bulunamadı' diye iptal edilen seçimleri yeniden dene (true/false)"
        default: "false"

permissions:
  contents: read

jobs:
  sonuclandir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Bitmiş maçlarla kuponları sonuçlandır
        run: node scripts/settle-coupons.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TEKRAR: ${{ github.event.inputs.tekrar }}
