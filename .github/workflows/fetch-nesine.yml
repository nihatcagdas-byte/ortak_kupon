name: Nesine bülteni

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Türkiye saati (GitHub bazen 5-30 dk geciktirebilir)
  workflow_dispatch:      # elle de çalıştırılabilir

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıkları kur
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Bülteni çek ve Firestore'a yaz
        run: node scripts/fetch-nesine.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
