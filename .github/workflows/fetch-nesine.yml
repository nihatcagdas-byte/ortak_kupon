name: Nesine bülteni ve AI kuponları

on:
  schedule:
    # GitHub zamanlayıcısı saatlerce gecikebildiği için sabah 08:07-10:47 (TR) arasında 20 dakikada bir denenir.
    # İş bittiyse sonraki denemeler hemen çıkar (bülten taze ise Nesine'ye tekrar istek atılmaz, kuponlar varsa üretilmez).
    - cron: "7,27,47 5-7 * * *"
  workflow_dispatch:      # elle de çalıştırılabilir
    inputs:
      force:
        description: "Bugünün AI kuponlarını yeniden üret (zaten varsa üzerine yazar)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gunluk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        run: npm install --prefix scripts --no-audit --no-fund

      - name: Nesine bültenini çek ve Firestore'a yaz
        run: node scripts/fetch-nesine.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SKIP_IF_FRESH: ${{ github.event_name == 'schedule' && '1' || '' }}

      # Bülten yoksa/eskiyse bu adım hata yazar ve nedeni sayfada görünür (eski oranlarla kupon üretilmez)
      - name: AI kuponlarını üret
        if: always()
        run: node scripts/generate-coupons.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
